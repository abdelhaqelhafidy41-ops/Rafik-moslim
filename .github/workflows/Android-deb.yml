name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download project source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 3. Install Android SDK tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools

      # 4. Verify Java and Android SDK
      - name: Verify Build Environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          adb version
          sdkmanager --list_installed

      # 5. Check Gradle wrapper
      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      # 6. Build the Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          CI: "true"

      # 7. Find generated APK files
      - name: Locate APK
        if: success()
        run: |
          echo "Searching for generated APK files..."
          find . -type f -path "*/build/outputs/apk/debug/*.apk" -print

      # 8. Upload APK to GitHub Actions
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
